<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskForge - Real-Time Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
    .status-badge { padding: 6px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; background: #1e293b; color: #94a3b8; }
    .status-badge.connected { background: #065f46; color: #34d399; }
    
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    .card { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #cbd5e1; }
    
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: #94a3b8; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.9rem; }
    button { background: #0284c7; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    button:hover { background: #0369a1; }
    
    .metrics-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .metric-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; text-align: center; }
    .metric-card .value { font-size: 1.8rem; font-weight: 700; color: #f8fafc; margin-top: 4px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { padding: 12px; color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 600; }
    td { padding: 12px; border-bottom: 1px solid #334155; }
    
    .state { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .state-PENDING { background: #334155; color: #cbd5e1; }
    .state-RUNNING { background: #854d0e; color: #fde047; }
    .state-COMPLETED { background: #065f46; color: #34d399; }
    .state-FAILED { background: #991b1b; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>TaskForge Dashboard</h1>
    <div id="ws-status" class="status-badge">Connecting WebSocket...</div>
  </header>

  <div class="metrics-summary">
    <div class="metric-card"><div>Total Submitted</div><div id="m-submitted" class="value">0</div></div>
    <div class="metric-card"><div>Active Workers</div><div id="m-active" class="value">3</div></div>
    <div class="metric-card"><div>Completed</div><div id="m-completed" class="value">0</div></div>
    <div class="metric-card"><div>Failed / DLQ</div><div id="m-failed" class="value">0</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Submit New Task</h2>
      <form id="task-form">
        <div>
          <label>Task Name</label>
          <input type="text" id="task-name" placeholder="e.g. process_orders" required>
        </div>
        <div>
          <label>Payload</label>
          <input type="text" id="task-payload" placeholder="e.g. sample payload" required>
        </div>
        <div>
          <label>Priority (0-10)</label>
          <input type="number" id="task-priority" value="0" min="0" max="10">
        </div>
        <button type="submit">Dispatch Task</button>
      </form>
    </div>

    <div class="card">
      <h2>Live Execution Log</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Retries</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="task-table-body">
          <tr><td colspan="5" style="text-align:center; color:#64748b;">Loading tasks...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
