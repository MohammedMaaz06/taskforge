replicaCount: 3

image:
  repository: taskforge
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 15s

redis:
  host: "redis-master.default.svc.cluster.local"
  port: 6379

env:
  PORT: "8080"
  REDIS_ADDR: "redis-master:6379"
  SQLITE_PATH: "/data/taskforge.db"

persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

