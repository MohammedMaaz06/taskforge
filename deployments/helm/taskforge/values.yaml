replicaCount: 2

image:
  repository: taskforge
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false

env:
  PORT: "8080"
  REDIS_ADDR: "redis-master.default.svc.cluster.local:6379"
  SQLITE_PATH: "/data/taskforge.db"
  WORK_DELAY_MS: "2000"

persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 80

