replicaCount: 3

image:
  repository: taskforge
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false

env:
  PORT: "8080"
  REDIS_ADDR: "redis-master.default.svc.cluster.local:6379"
  SQLITE_PATH: "/data/taskforge.db"

persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

