services:
  taskforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskforge-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/taskforge.db
      - PORT=8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
