<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge - Live Control Center</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card);
            border-radius: 8px;
            padding: 1.25rem;
            border: 1px solid #334155;
        }

        .card-title {
            color: var(--muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .card-value {
            font-size: 2.25rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: var(--accent);
        }

        .card-value.danger { color: var(--danger); }
        .card-value.success { color: var(--success); }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        input, select, button {
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
        }

        button {
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        button:hover { opacity: 0.9; }
        button.danger-btn { background: var(--danger); color: var(--text); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th { background: #0f172a; color: var(--muted); }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-COMPLETED { background: #166534; color: #4ade80; }
        .badge-RUNNING { background: #1e40af; color: #60a5fa; }
        .badge-PENDING { background: #854d0e; color: #fde047; }
        .badge-FAILED, .badge-DLQ { background: #991b1b; color: #f87171; }
    </style>
</head>
<body>
    <div class="header">
        <h1>TaskForge Dashboard</h1>
        <span id="live-indicator" style="color: var(--success);">Live Monitoring Active</span>
    </div>

    <!-- Metric Cards -->
    <div class="grid">
        <div class="card">
            <div class="card-title">Active Workers</div>
            <div class="card-value" id="val-workers">0</div>
        </div>
        <div class="card">
            <div class="card-title">Pending Queue</div>
            <div class="card-value" id="val-queue">0</div>
        </div>
        <div class="card">
            <div class="card-title">Dead Letter Queue</div>
            <div class="card-value danger" id="val-dlq">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active Webhooks</div>
            <div class="card-value success" id="val-webhooks">0</div>
        </div>
    </div>

    <!-- Quick Actions Panel -->
    <div class="control-panel">
        <div class="card">
            <div class="card-title">Scale Worker Pool</div>
            <div class="form-group">
                <input type="number" id="worker-count" min="1" max="20" placeholder="Count (e.g. 5)">
                <button onclick="scaleWorkers()">Set Workers</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">DLQ Quick Controls</div>
            <div class="form-group">
                <button class="danger-btn" onclick="purgeDLQ()">Purge DLQ</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Register Webhook</div>
            <div class="form-group">
                <input type="text" id="webhook-url" placeholder="https://example.com/webhook">
                <button onclick="registerWebhook()">Register</button>
            </div>
        </div>
    </div>

    <!-- Recent Tasks Table -->
    <h2>Task Execution Registry</h2>
    <table>
        <thead>
            <tr>
                <th>Task ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Retries</th>
                <th>Scheduled At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="task-table-body">
            <tr><td colspan="6">Loading active tasks...</td></tr>
        </tbody>
    </table>

    <script>
        async function updateDashboard() {
            try {
                // Fetch Workers Count
                const workerRes = await fetch("/workers/scale");
                const workerData = await workerRes.json();
                document.getElementById("val-workers").innerText = workerData.workers || 0;

                // Fetch DLQ Status
                const dlqRes = await fetch("/dlq");
                const dlqTasks = await dlqRes.json();
                document.getElementById("val-dlq").innerText = dlqTasks.length || 0;

                // Fetch Registered Webhooks
                const webhookRes = await fetch("/webhooks");
                const webhookData = await webhookRes.json();
                document.getElementById("val-webhooks").innerText = (webhookData.webhooks || []).length;

                // Fetch Tasks
                const tasksRes = await fetch("/tasks");
                const tasks = await tasksRes.json();

                let pendingCount = 0;
                const tbody = document.getElementById("task-table-body");
                tbody.innerHTML = "";

                if (tasks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No tasks processed yet.</td></tr>';
                } else {
                    tasks.reverse().forEach(t => {
                        if (t.status === "PENDING") pendingCount++;
                        
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td><code>${t.id}</code></td>
                            <td>${t.name}</td>
                            <td><span class="badge badge-${t.status}">${t.status}</span></td>
                            <td>${t.current_retry} / ${t.max_retries}</td>
                            <td>${new Date(t.scheduled_at).toLocaleTimeString()}</td>
                            <td>
                                ${t.status === "PENDING" ? '<button class="danger-btn" onclick="cancelTask(\'' + t.id + '\')">Cancel</button>' : "-"}
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                }

                document.getElementById("val-queue").innerText = pendingCount;
            } catch (err) {
                console.error("Error polling dashboard metrics:", err);
            }
        }

        async function scaleWorkers() {
            const count = parseInt(document.getElementById("worker-count").value);
            if (!count) return;
            await fetch("/workers/scale", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ workers: count })
            });
            updateDashboard();
        }

        async function cancelTask(id) {
            await fetch('/tasks/cancel?id=' + id, { method: "POST" });
            updateDashboard();
        }

        async function purgeDLQ() {
            await fetch("/dlq/purge", { method: "POST" });
            updateDashboard();
        }

        async function registerWebhook() {
            const url = document.getElementById("webhook-url").value;
            if (!url) return;
            await fetch("/webhooks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: url })
            });
            document.getElementById("webhook-url").value = "";
            updateDashboard();
        }

        // Poll metrics every 2 seconds
        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
