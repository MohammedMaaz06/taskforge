<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge - Live Task Monitor</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f5f2eb; color: #1c1917; margin: 0; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e7e5e4; padding-bottom: 15px; margin-bottom: 25px; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 36px; height: 36px; fill: #2563eb; }
        h1 { margin: 0; font-size: 1.75rem; font-weight: 700; color: #1c1917; letter-spacing: -0.5px; }
        
        .status-badge { padding: 6px 14px; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; }
        .connected { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .disconnected { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        
        .card { background: #ffffff; border-radius: 12px; padding: 24px; margin-bottom: 25px; border: 1px solid #e7e5e4; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card h3 { margin-top: 0; font-size: 1.1rem; color: #44403c; margin-bottom: 16px; }
        
        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; }
        input, button { background: #fafaf9; border: 1px solid #d6d3d1; color: #1c1917; padding: 12px; border-radius: 8px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        
        button { background: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
        button:hover { background: #1d4ed8; }
        button:active { transform: translateY(1px); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #e7e5e4; }
        th { color: #78716c; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; }
        .badge-PENDING { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .badge-RUNNING { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .badge-COMPLETED { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .badge-FAILED, .badge-DLQ { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        code { background: #f5f5f4; padding: 4px 8px; border-radius: 4px; font-family: monospace; color: #2563eb; border: 1px solid #e7e5e4; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h1>TaskForge Live Monitor</h1>
            </div>
            <span id="connection-status" class="status-badge disconnected">Disconnected</span>
        </header>

        <div class="card">
            <h3>Submit New Task</h3>
            <form id="task-form">
                <input type="text" id="task-name" placeholder="Task Name (e.g., process-image)" required>
                <input type="number" id="task-priority" placeholder="Priority (1-10)" value="5" min="1" max="10" required>
                <input type="number" id="task-retries" placeholder="Max Retries" value="3" min="0" max="10" required>
                <button type="submit">Submit Task</button>
            </form>
        </div>

        <div class="card">
            <h3>Real-Time Task Stream</h3>
            <table>
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Error Details</th>
                    </tr>
                </thead>
                <tbody id="task-table-body">
                    <tr><td colspan="4" style="text-align:center; color:#78716c;">No live events received yet. Submit a task above!</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // WebSocket & API Integration
        const wsUri = "ws://" + window.location.host + "/ws";
        let ws;
        const tasks = new Map();

        function connectWebSocket() {
            ws = new WebSocket(wsUri);

            ws.onopen = () => {
                const status = document.getElementById("connection-status");
                status.textContent = "Live Connected";
                status.className = "status-badge connected";
            };

            ws.onclose = () => {
                const status = document.getElementById("connection-status");
                status.textContent = "Disconnected (Retrying...)";
                status.className = "status-badge disconnected";
                setTimeout(connectWebSocket, 2000);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "TASK_STATUS_UPDATE") {
                    updateTaskRow(msg.payload);
                }
            };
        }

        function updateTaskRow(data) {
            tasks.set(data.task_id, data);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById("task-table-body");
            if (tasks.size === 0) return;

            tbody.innerHTML = "";
            Array.from(tasks.values()).reverse().forEach(task => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><code>${task.task_id}</code></td>
                    <td>${task.name}</td>
                    <td><span class="badge badge-${task.status}">${task.status}</span></td>
                    <td style="color: #b91c1c;">${task.error || "-"}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById("task-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("task-name").value;
            const priority = parseInt(document.getElementById("task-priority").value);
            const retries = parseInt(document.getElementById("task-retries").value);

            await fetch("/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    payload: btoa("sample-payload"),
                    priority: priority,
                    max_retries: retries
                })
            });

            document.getElementById("task-name").value = "";
        });

        fetch("/tasks")
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data)) {
                    data.forEach(t => tasks.set(t.id, { task_id: t.id, name: t.name, status: t.status, error: t.last_error }));
                    renderTable();
                }
            })
            .catch(() => {});

        connectWebSocket();
    </script>
</body>
</html>
